# Builds the website and the book with Quarto and publishes them to GitHub Pages.
#
# The rendered chapters contain executable Python examples, so the workflow installs
# Python and the packages used by the book before rendering. The pages are rendered
# under _site/content and copied to the site root, so that /book/, /playground/,
# and /slides/ work as before.
#
# One-time setup on GitHub: Settings > Pages > Build and deployment >
# Source: "GitHub Actions".

name: Publish website and book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e data2thesis
          pip install jupyter ipykernel pandas numpy scipy statsmodels scikit-learn matplotlib seaborn tabulate beautifulsoup4 pypdf openpyxl pyreadstat

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render website and book
        run: |
          quarto render
          cp -r _site/content/* _site/
          touch _site/.nojekyll

      - name: Build Full Book Single-Page Edition
        run: python scripts/build_full_book.py

      - name: Copy PDF book to site
        run: |
          mkdir -p _site/downloads
          cp -f downloads/*.pdf _site/downloads/ 2>/dev/null || true
          cp -f downloads/*.csv _site/downloads/ 2>/dev/null || true
          cp -f downloads/*.xlsx _site/downloads/ 2>/dev/null || true
          cp -f downloads/*.tar.gz _site/downloads/ 2>/dev/null || true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
