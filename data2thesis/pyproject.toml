[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data2thesis"
version = "1.1.0"
description = "Data and companion utilities for 'FROM DATA TO THESIS: Using Python for Non-Technical'"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dr. Polla Fattah", email = "polla.fattah@gmail.com" }
]
keywords = [
    "data-science",
    "education",
    "wellbeing",
    "thesis",
    "research-methods",
    "pedagogy",
    "statistics"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "openpyxl>=3.0",
    "pyreadstat>=1.2.0",
]

[project.urls]
Homepage = "https://polla-fattah.github.io/data2thesis_python"
Documentation = "https://polla-fattah.github.io/data2thesis_python"
Repository = "https://github.com/polla-fattah/data2thesis_python"
Issues = "https://github.com/polla-fattah/data2thesis_python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"data2thesis" = ["datasets/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
